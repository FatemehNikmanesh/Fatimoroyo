<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>بازی دخترک ماجراجو</title>
<style>
  html, body {
      margin: 0;
      padding: 0;
      background-color: #14102b;
      overscroll-behavior: none;
  }
  body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: sans-serif;
  }
  .game-wrap {
      position: relative;
      display: inline-block;
      max-width: 100%;
      line-height: 0;
  }
  canvas {
      border: 4px solid #d9c4ff;
      border-radius: 6px;
      background-color: #5c94fc;
      max-width: 100%;
      height: auto;
      touch-action: none;
      display: block;
  }
  .touch-controls {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 4%;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 0 4%;
      pointer-events: none;
  }
  .touch-side {
      display: flex;
      gap: 12px;
      pointer-events: auto;
  }
  .touch-btn {
      width: 15vw;
      height: 15vw;
      max-width: 64px;
      max-height: 64px;
      min-width: 48px;
      min-height: 48px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.65);
      background: radial-gradient(circle at 30% 30%, #a78bfa, #6d28d9);
      color: #fff;
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 8px rgba(0,0,0,0.4);
      -webkit-user-select: none;
      user-select: none;
      touch-action: none;
      pointer-events: auto;
      opacity: 0.85;
  }
  .touch-jump {
      width: 18vw;
      height: 18vw;
      max-width: 76px;
      max-height: 76px;
      min-width: 56px;
      min-height: 56px;
      font-size: 26px;
      background: radial-gradient(circle at 30% 30%, #ffd97a, #b45309);
  }
  @media (hover: hover) and (pointer: fine) {
      .touch-controls { display: none; }
  }
</style>
</head>
<body>

<div class="game-wrap">
  <canvas id="gameCanvas" width="800" height="400"></canvas>
  <div class="touch-controls">
    <div class="touch-side">
      <button id="btnLeft" class="touch-btn" aria-label="چپ">◀</button>
      <button id="btnRight" class="touch-btn" aria-label="راست">▶</button>
    </div>
    <button id="btnJump" class="touch-btn touch-jump" aria-label="پرش">⤒</button>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const gravity = 0.5;
let score = 0;
let cameraX = 0;
let frameCount = 0;

// تعریف مراحل بازی (هر مرحله طولانی‌تر و سخت‌تر از قبلی)
const LEVELS = [

        playerStart: { x: 50, y: 300 },
        platforms: [
            { x: 0, y: 360, width: 380, height: 40, color: '#4e9221' },
            { x: 480, y: 360, width: 320, height: 40, color: '#4e9221' },
            { x: 900, y: 360, width: 350, height: 40, color: '#4e9221' },
            { x: 1350, y: 360, width: 350, height: 40, color: '#4e9221' },
            { x: 150, y: 300, width: 100, height: 20, color: '#b84418' },
            { x: 320, y: 250, width: 100, height: 20, color: '#b84418' },
            { x: 500, y: 280, width: 90, height: 20, color: '#b84418' },
            { x: 650, y: 210, width: 90, height: 20, color: '#b84418' },
            { x: 800, y: 280, width: 90, height: 20, color: '#b84418' },
            { x: 960, y: 300, width: 100, height: 20, color: '#b84418' },
            { x: 1120, y: 240, width: 100, height: 20, color: '#b84418' },
            { x: 1280, y: 300, width: 90, height: 20, color: '#b84418' },
            { x: 1450, y: 260, width: 120, height: 20, color: '#b84418' }
        ],
        bricks: [
            { x: 660, y: 150, width: 40, height: 40, hasMushroom: true },
            { x: 1130, y: 190, width: 40, height: 40, hasMushroom: false }
        ],
        coins: [
            { x: 200, y: 260 },

            { x: 545, y: 240 },
            { x: 845, y: 240 },
            { x: 1010, y: 260 },
            { x: 1170, y: 200 },
            { x: 1500, y: 220 }
        ],
        enemies: [
            { x: 550, y: 330, minX: 480, maxX: 780, speed: 2.2, direction: 1 },
            { x: 950, y: 330, minX: 900, maxX: 1230, speed: 2.4, direction: 1 },
            { x: 1400, y: 330, minX: 1350, maxX: 1650, speed: 2.6, direction: -1 }
        ],
        goal: { x: 1650, y: 280, width: 26, height: 80 }
    },
    {
        width: 2100,
        theme: { skyTop: '#1b1140', skyBottom: '#5b3a8e', mountains: '#2e1f57', stars: true },
        playerStart: { x: 50, y: 300 },
        platforms: [
            { x: 0, y: 360, width: 300, height: 40, color: '#4e9221' },
            { x: 390, y: 360, width: 260, height: 40, color: '#4e9221' },
            { x: 740, y: 360, width: 260, height: 40, color: '#4e9221' },
            { x: 1090, y: 360, width: 260, height: 40, color: '#4e9221' },
            { x: 1440, y: 360, width: 260, height: 40, color: '#4e9221' },
            { x: 1790, y: 360, width: 310, height: 40, color: '#4e9221' },
            { x: 120, y: 300, width: 90, height: 20, color: '#b84418' },
            { x: 260, y: 240, width: 90, height: 20, color: '#b84418' },
            { x: 260, y: 150, width: 90, height: 20, color: '#b84418' },
            { x: 430, y: 260, width: 90, height: 20, color: '#b84418' },
            { x: 590, y: 200, width: 90, height: 20, color: '#b84418' },
            { x: 780, y: 260, width: 90, height: 20, color: '#b84418' },
            { x: 900, y: 180, width: 90, height: 20, color: '#b84418' },
            { x: 1090, y: 280, width: 90, height: 20, color: '#b84418' },
            { x: 1230, y: 210, width: 90, height: 20, color: '#b84418' },
            { x: 1440, y: 260, width: 90, height: 20, color: '#b84418' },
            { x: 1590, y: 180, width: 90, height: 20, color: '#b84418' },
            { x: 1790, y: 280, width: 90, height: 20, color: '#b84418' },
            { x: 1930, y: 210, width: 90, height: 20, color: '#b84418' }
        ],
        bricks: [
            { x: 300, y: 100, width: 40, height: 40, hasMushroom: true },
            { x: 940, y: 130, width: 40, height: 40, hasMushroom: false },
            { x: 1630, y: 130, width: 40, height: 40, hasMushroom: false }
        ],
        coins: [
            { x: 165, y: 260 },
            { x: 305, y: 200 },
            { x: 305, y: 110 },
            { x: 475, y: 220 },
            { x: 635, y: 160 },
            { x: 825, y: 220 },
            { x: 1135, y: 240 },
            { x: 1275, y: 170 },
            { x: 1485, y: 220 },
            { x: 1635, y: 140 },
            { x: 1975, y: 170 }
        ],
        enemies: [
            { x: 450, y: 330, minX: 390, maxX: 640, speed: 2.6, direction: 1 },
            { x: 800, y: 330, minX: 740, maxX: 990, speed: 2.8, direction: 1 },
            { x: 1150, y: 330, minX: 1090, maxX: 1340, speed: 3, direction: -1 },
            { x: 1500, y: 330, minX: 1440, maxX: 1690, speed: 3.2, direction: -1 },
            { x: 1850, y: 330, minX: 1790, maxX: 2080, speed: 3, direction: 1 }
        ],
        goal: { x: 2040, y: 280, width: 26, height: 80 }
    }
];

// بازیکن (دختر با تیشرت آبی و شلوار سفید و موی دم‌اسبی)
const player = {
    x: 50,
    y: 300,
    width: 30,
    height: 40,
    dx: 0,
    dy: 0,
    speed: 5,
    jumpPower: -12,
    grounded: false,
    facing: 1,
    powered: false // بعد از خوردن قارچ، چکش دستش میاد
};

let currentLevelIndex = 0;
let levelWidth = 800;
let platforms = [];
let bricks = [];
let solids = [];
let coins = [];
let enemies = [];
let powerups = [];
let goal = null;

// gameState: 'playing' | 'transition' | 'won'
let gameState = 'playing';
let transitionTimer = 0;
let transitionMessage = '';

const keys = { right: false, left: false };

function doJump() {
    if (player.grounded) {
        player.dy = player.jumpPower;
        player.grounded = false;
    }
}

document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
    if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
    if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') doJump();
    if (gameState === 'won' && (e.key === 'Enter' || e.key === ' ')) {
        startGame();
    }
});

document.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
    if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
});

// کنترل‌های لمسی برای موبایل
function bindTouchButton(id, onDown, onUp) {
    const el = document.getElementById(id);
    const start = (e) => { e.preventDefault(); onDown(); };
    const end = (e) => { e.preventDefault(); onUp(); };
    el.addEventListener('touchstart', start, { passive: false });
    el.addEventListener('touchend', end, { passive: false });
    el.addEventListener('touchcancel', end, { passive: false });
    el.addEventListener('mousedown', start);
    el.addEventListener('mouseup', end);
    el.addEventListener('mouseleave', end);
}

bindTouchButton('btnLeft', () => { keys.left = true; }, () => { keys.left = false; });
bindTouchButton('btnRight', () => { keys.right = true; }, () => { keys.right = false; });
bindTouchButton('btnJump', () => {
    if (gameState === 'won') { startGame(); return; }
    doJump();
}, () => {});

function loadLevel(index) {
    const level = LEVELS[index];
    levelWidth = level.width;
    platforms = level.platforms;
    bricks = level.bricks.map(b => ({ ...b, hit: false }));
    solids = [...platforms, ...bricks];
    coins = level.coins.map(c => ({ x: c.x, y: c.y, radius: 8, collected: false }));
    enemies = level.enemies.map(e => ({
        x: e.x, y: e.y, width: 34, height: 24,
        minX: e.minX, maxX: e.maxX, speed: e.speed, direction: e.direction, dead: false
    }));
    powerups = [];
    goal = level.goal;

    player.x = level.playerStart.x;
    player.y = level.playerStart.y;
    player.dx = 0;
    player.dy = 0;
    player.powered = false;
    cameraX = 0;
}

function resetLevel() {
    // فقط مرحله فعلی از نو شروع می‌شود، امتیاز حفظ می‌شود
    loadLevel(currentLevelIndex);
}

function startGame() {
    score = 0;
    currentLevelIndex = 0;
    gameState = 'playing';
    loadLevel(currentLevelIndex);
}

function checkBrickHits() {
    bricks.forEach(brick => {
        const withinX = player.x < brick.x + brick.width && player.x + player.width > brick.x;
        const brickBottom = brick.y + brick.height;
        const prevHeadY = player.y - player.dy;

        if (player.dy < 0 && withinX && player.y <= brickBottom && prevHeadY > brickBottom) {
            player.dy = 0;
            player.y = brickBottom;

            if (!brick.hit) {
                brick.hit = true;
                if (brick.hasMushroom) {
                    powerups.push({
                        x: brick.x + brick.width / 2 - 12,
                        y: brick.y - 24,
                        width: 24,
                        height: 24,
                        dx: 1.5,
                        dy: 0,
                        spawnTimer: 20,
                        collected: false
                    });
                }
            }
        }
    });
}

function updatePowerups() {
    powerups.forEach(p => {
        if (p.spawnTimer > 0) {
            p.spawnTimer--;
            return;
        }
        p.dy += gravity;
        p.x += p.dx;
        p.y += p.dy;

        solids.forEach(s => {
            if (
                p.x < s.x + s.width &&
                p.x + p.width > s.x &&
                p.y + p.height <= s.y + p.dy &&
                p.y + p.height + p.dy >= s.y
            ) {
                p.dy = 0;
                p.y = s.y - p.height;
            }
        });

        if (p.x < 0 || p.x + p.width > levelWidth) {
            p.dx *= -1;
        }
    });

    powerups = powerups.filter(p => !p.collected && p.y < canvas.height + 60);
}

function update() {
    frameCount++;

    if (gameState === 'transition') {
        transitionTimer--;
        if (transitionTimer <= 0) {
            currentLevelIndex++;
            if (currentLevelIndex >= LEVELS.length) {
                gameState = 'won';
            } else {
                loadLevel(currentLevelIndex);
                gameState = 'playing';
            }
        }
        draw();
        requestAnimationFrame(update);
        return;
    }

    if (gameState === 'won') {
        draw();
        requestAnimationFrame(update);
        return;
    }

    // حرکت بازیکن
    if (keys.right) { player.dx = player.speed; player.facing = 1; }
    else if (keys.left) { player.dx = -player.speed; player.facing = -1; }
    else player.dx = 0;

    player.x += player.dx;
    player.dy += gravity;
    player.y += player.dy;

    if (player.x < 0) player.x = 0;
    if (player.x + player.width > levelWidth) player.x = levelWidth - player.width;

    // برخورد بازیکن با سکوها و آجرها (از بالا، مثل ایستادن روی سکو)
    player.grounded = false;
    solids.forEach(platform => {
        if (
            player.x < platform.x + platform.width &&
            player.x + player.width > platform.x &&
            player.y + player.height <= platform.y + player.dy &&
            player.y + player.height + player.dy >= platform.y
        ) {
            player.dy = 0;
            player.y = platform.y - player.height;
            player.grounded = true;
        }
    });

    // برخورد بازیکن با زیرِ آجرها (ضربه از پایین)
    checkBrickHits();

    // اگر از پایین صفحه بیفتد، مرحله از نو شروع شود
    if (player.y > canvas.height) {
        resetLevel();
    }

    // حرکت خرچنگ‌ها و چرخش بین مرزهای هر کدام
    enemies.forEach(enemy => {
        if (enemy.dead) return;
        enemy.x += enemy.speed * enemy.direction;
        if (enemy.x <= enemy.minX || enemy.x + enemy.width >= enemy.maxX) {
            enemy.direction *= -1;
        }
    });

    updatePowerups();

    // برخورد بازیکن با سکه‌ها
    coins.forEach(coin => {
        if (!coin.collected) {
            const distX = (player.x + player.width / 2) - coin.x;
            const distY = (player.y + player.height / 2) - coin.y;
            const distance = Math.sqrt(distX * distX + distY * distY);

            if (distance < player.width / 2 + coin.radius) {
                coin.collected = true;
                score += 10;
            }
        }
    });

    // برخورد بازیکن با قارچ قدرت (قوی شدن و گرفتن چکش)
    powerups.forEach(p => {
        if (p.collected || p.spawnTimer > 0) return;
        if (
            player.x < p.x + p.width &&
            player.x + player.width > p.x &&
            player.y < p.y + p.height &&
            player.y + player.height > p.y
        ) {
            p.collected = true;
            player.powered = true;
            score += 50;
        }
    });

    // برخورد بازیکن با خرچنگ‌ها
    enemies.forEach(enemy => {
        if (enemy.dead) return;
        if (
            player.x < enemy.x + enemy.width &&
            player.x + player.width > enemy.x &&
            player.y < enemy.y + enemy.height &&
            player.y + player.height > enemy.y
        ) {
            if (player.powered) {
                // با چکش خرچنگ رو له می‌کنه
                enemy.dead = true;
                score += 20;
            } else {
                resetLevel();
            }
        }
    });

    // برخورد بازیکن با دروازه پایان مرحله
    if (
        goal &&
        player.x < goal.x + goal.width &&
        player.x + player.width > goal.x &&
        player.y < goal.y + goal.height &&
        player.y + player.height > goal.y
    ) {
        gameState = 'transition';
        transitionTimer = 90;
        transitionMessage = (currentLevelIndex < LEVELS.length - 1)
            ? `مرحله ${currentLevelIndex + 1} کامل شد! 🎉`
            : 'آخرین مرحله کامل شد! 🏆';
    }

    // دوربین دنبال بازیکن حرکت می‌کند تا مرحله طولانی‌تر دیده شود
    const maxCamera = Math.max(0, levelWidth - canvas.width);
    cameraX = Math.max(0, Math.min(player.x + player.width / 2 - canvas.width / 2, maxCamera));

    draw();
    requestAnimationFrame(update);
}

function drawCloud(x, y) {
    ctx.beginPath();
    ctx.arc(x, y, 18, 0, Math.PI * 2);
    ctx.arc(x + 20, y - 8, 22, 0, Math.PI * 2);
    ctx.arc(x + 42, y, 18, 0, Math.PI * 2);
    ctx.closePath();
    ctx.fill();
}

function drawCastleSilhouette(x, groundY) {
    ctx.fillRect(x, groundY - 70, 80, 70);
    ctx.fillRect(x - 18, groundY - 50, 20, 50);
    ctx.fillRect(x + 78, groundY - 50, 20, 50);
    for (let i = 0; i < 5; i++) {
        ctx.fillRect(x + i * 18 - 4, groundY - 78, 10, 10);
    }
    ctx.fillRect(x + 30, groundY - 100, 20, 30);
    ctx.beginPath();
    ctx.moveTo(x + 28, groundY - 100);
    ctx.lineTo(x + 40, groundY - 118);
    ctx.lineTo(x + 52, groundY - 100);
    ctx.closePath();
    ctx.fill();
}

function drawBackground(theme) {
    const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
    grad.addColorStop(0, theme.skyTop);
    grad.addColorStop(1, theme.skyBottom);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // ستاره‌های چشمک‌زن (فقط مراحل شبانه)
    if (theme.stars) {
        for (let i = 0; i < 40; i++) {
            const sx = (i * 137.5) % canvas.width;
            const sy = (i * 97.3) % (canvas.height * 0.55);
            const twinkle = 0.35 + 0.65 * Math.abs(Math.sin(frameCount * 0.03 + i));
            ctx.fillStyle = `rgba(255,255,255,${twinkle.toFixed(2)})`;
            ctx.beginPath();
            ctx.arc(sx, sy, 1.5, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    // ماه/خورشید با هاله نورانی
    const glowX = 130, glowY = 70;
    const haloGrad = ctx.createRadialGradient(glowX, glowY, 5, glowX, glowY, 60);
    haloGrad.addColorStop(0, theme.stars ? 'rgba(220,220,255,0.85)' : 'rgba(255,244,200,0.9)');
    haloGrad.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = haloGrad;
    ctx.beginPath();
    ctx.arc(glowX, glowY, 60, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = theme.stars ? '#eceaff' : '#fff6d8';
    ctx.beginPath();
    ctx.arc(glowX, glowY, 22, 0, Math.PI * 2);
    ctx.fill();

    // کوه‌های دوردست (پارالاکس آهسته)
    const mountainOffset = cameraX * 0.25;
    ctx.fillStyle = theme.mountains;
    for (let i = -1; i < Math.ceil(levelWidth / 400) + 1; i++) {
        const baseX = i * 400 - mountainOffset;
        ctx.beginPath();
        ctx.moveTo(baseX, 300);
        ctx.lineTo(baseX + 100, 190);
        ctx.lineTo(baseX + 200, 300);
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(baseX + 150, 300);
        ctx.lineTo(baseX + 260, 220);
        ctx.lineTo(baseX + 370, 300);
        ctx.closePath();
        ctx.fill();
    }

    // قلعه فانتزی دوردست
    const castleOffset = cameraX * 0.15;
    ctx.fillStyle = theme.stars ? '#241a4a' : '#7d6aa8';
    for (let i = -1; i < Math.ceil(levelWidth / 900) + 1; i++) {
        drawCastleSilhouette(i * 900 - castleOffset + 500, 300);
    }

    // ابرها (پارالاکس سریع‌تر)
    const cloudOffset = cameraX * 0.4;
    ctx.fillStyle = theme.stars ? 'rgba(255,255,255,0.18)' : 'rgba(255,255,255,0.9)';
    for (let i = -1; i < Math.ceil(levelWidth / 500) + 1; i++) {
        drawCloud(i * 500 - cloudOffset + 60, 55);
        drawCloud(i * 500 - cloudOffset + 260, 105);
    }
}

function drawGroundDecor(p) {
    ctx.fillStyle = '#3f7a1a';
    ctx.fillRect(p.x - cameraX, p.y, p.width, 6);
    for (let gx = 14; gx < p.width; gx += 46) {
        const fx = p.x - cameraX + gx;
        const fy = p.y - 3;
        ctx.fillStyle = '#ff8fd8';
        ctx.beginPath(); ctx.arc(fx, fy, 3, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#fff5a0';
        ctx.beginPath(); ctx.arc(fx, fy, 1.3, 0, Math.PI * 2); ctx.fill();
    }
}

function drawPlatformDecor(p) {
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    ctx.fillRect(p.x - cameraX, p.y, p.width, 3);
    ctx.fillStyle = '#8bc34a';
    for (let mx = 8; mx < p.width; mx += 32) {
        ctx.beginPath();
        ctx.arc(p.x - cameraX + mx, p.y + 2, 3, 0, Math.PI * 2);
        ctx.fill();
    }
}

function drawGirl(x, y, w, h, facing, powered) {
    const headRadius = w * 0.38;
    const headCenterX = x + w / 2;
    const headCenterY = y + headRadius + 1;
    const bodyTop = y + headRadius * 2 - 2;
    const legsTop = bodyTop + (h - (bodyTop - y)) * 0.5;
    const skin = '#ffd9b3';
    const hair = '#4a2f22';

    // دم اسبی (پشت سر، جهت مخالفِ نگاه)
    const tailDir = facing >= 0 ? -1 : 1;
    ctx.fillStyle = hair;
    ctx.save();
    ctx.translate(headCenterX + tailDir * headRadius * 0.75, headCenterY - headRadius * 0.1);
    ctx.rotate(tailDir * 0.5);
    ctx.beginPath();
    ctx.ellipse(0, 0, headRadius * 0.28, headRadius * 0.75, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // پاها (شلوار سفید)
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#c9c9c9';
    ctx.lineWidth = 1;
    ctx.fillRect(x + w * 0.1, legsTop, w * 0.8, y + h - legsTop);
    ctx.strokeRect(x + w * 0.1, legsTop, w * 0.8, y + h - legsTop);

    // دست‌ها (پوست)
    ctx.fillStyle = skin;
    ctx.fillRect(x - w * 0.12, bodyTop + 2, w * 0.2, (legsTop - bodyTop) * 0.75);
    ctx.fillRect(x + w * 0.92, bodyTop + 2, w * 0.2, (legsTop - bodyTop) * 0.75);

    // تنه (تیشرت آبی)
    ctx.fillStyle = '#2f6fed';
    ctx.fillRect(x + w * 0.06, bodyTop, w * 0.88, legsTop - bodyTop);

    // سر
    ctx.fillStyle = skin;
    ctx.beginPath();
    ctx.arc(headCenterX, headCenterY, headRadius, 0, Math.PI * 2);
    ctx.fill();

    // موی جلو
    ctx.fillStyle = hair;
    ctx.beginPath();
    ctx.arc(headCenterX, headCenterY, headRadius, Math.PI, 0, false);
    ctx.fill();
    ctx.fillRect(headCenterX - headRadius, headCenterY - headRadius * 0.15, headRadius * 2, headRadius * 0.35);

    // تل موی صورتی (لمسه فانتزی)
    ctx.fillStyle = '#ff6fb0';
    ctx.beginPath();
    ctx.arc(headCenterX + tailDir * headRadius * 0.15, headCenterY - headRadius * 0.85, headRadius * 0.16, 0, Math.PI * 2);
    ctx.fill();

    // چشم
    const eyeOffsetX = facing >= 0 ? headRadius * 0.22 : -headRadius * 0.22;
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(headCenterX + eyeOffsetX, headCenterY + headRadius * 0.15, headRadius * 0.11, 0, Math.PI * 2);
    ctx.fill();

    // چکش (وقتی قوی شده)
    if (powered) {
        const hx = facing >= 0 ? x + w * 0.95 : x - w * 0.55;
        const hy = bodyTop + (legsTop - bodyTop) * 0.35;
        ctx.strokeStyle = '#8a5a2b';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(hx, hy + 10);
        ctx.lineTo(hx + (facing >= 0 ? w * 0.35 : -w * 0.35), hy - w * 0.4);
        ctx.stroke();
        ctx.fillStyle = '#8d8d8d';
        ctx.fillRect(
            hx + (facing >= 0 ? w * 0.22 : -w * 0.58),
            hy - w * 0.62,
            w * 0.36,
            h * 0.18
        );
    }
}

function drawCrab(x, y, w, h) {
    const body = '#ff7a72';
    const dark = '#8a2e2b';

    // پاها
    ctx.strokeStyle = body;
    ctx.lineWidth = 2;
    for (let i = 0; i < 3; i++) {
        const legY = y + h * 0.55 + i * 3;
        ctx.beginPath(); ctx.moveTo(x + 2, legY); ctx.lineTo(x - 5, legY + 6); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x + w - 2, legY); ctx.lineTo(x + w + 5, legY + 6); ctx.stroke();
    }

    // چشم روی ساقه
    ctx.strokeStyle = dark;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x + w * 0.35, y + h * 0.35); ctx.lineTo(x + w * 0.3, y + h * 0.05); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + w * 0.65, y + h * 0.35); ctx.lineTo(x + w * 0.7, y + h * 0.05); ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(x + w * 0.3, y + h * 0.05, 3.4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + w * 0.7, y + h * 0.05, 3.4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(x + w * 0.3, y + h * 0.05, 1.5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + w * 0.7, y + h * 0.05, 1.5, 0, Math.PI * 2); ctx.fill();

    // چنگال‌ها
    ctx.fillStyle = body;
    ctx.beginPath();
    ctx.ellipse(x - w * 0.12, y + h * 0.4, w * 0.2, h * 0.2, -0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(x + w * 1.12, y + h * 0.4, w * 0.2, h * 0.2, 0.3, 0, Math.PI * 2);
    ctx.fill();

    // بدن
    ctx.beginPath();
    ctx.ellipse(x + w / 2, y + h * 0.6, w / 2, h * 0.42, 0, 0, Math.PI * 2);
    ctx.fill();
}

function drawMushroomPowerup(x, y, w, h) {
    ctx.fillStyle = '#e52521';
    ctx.beginPath();
    ctx.arc(x + w / 2, y + h * 0.42, w / 2, Math.PI, 0, false);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.fillRect(x, y + h * 0.36, w, h * 0.14);
    ctx.fillStyle = '#f4e4c1';
    ctx.fillRect(x + w * 0.2, y + h * 0.5, w * 0.6, h * 0.5);
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(x + w * 0.3, y + h * 0.15, w * 0.12, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + w * 0.7, y + h * 0.15, w * 0.1, 0, Math.PI * 2); ctx.fill();
}

function drawBrick(brick) {
    const sx = brick.x - cameraX;
    if (brick.hit) {
        ctx.fillStyle = '#8f8f9a';
        ctx.fillRect(sx, brick.y, brick.width, brick.height);
        ctx.strokeStyle = '#6f6f78';
        ctx.strokeRect(sx, brick.y, brick.width, brick.height);
        return;
    }
    if (brick.hasMushroom) {
        ctx.save();
        ctx.shadowColor = '#ffe27a';
        ctx.shadowBlur = 14;
    }
    const grad = ctx.createLinearGradient(0, brick.y, 0, brick.y + brick.height);
    grad.addColorStop(0, '#caa15a');
    grad.addColorStop(1, '#8a5a2b');
    ctx.fillStyle = grad;
    ctx.fillRect(sx, brick.y, brick.width, brick.height);
    ctx.strokeStyle = '#5c3a1a';
    ctx.lineWidth = 2;
    ctx.strokeRect(sx, brick.y, brick.width, brick.height);
    if (brick.hasMushroom) {
        ctx.restore();
        ctx.fillStyle = '#fff6d8';
        ctx.font = 'bold 18px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('؟', sx + brick.width / 2, brick.y + brick.height * 0.7);
        ctx.textAlign = 'left';
    }
}

function drawGoal(g) {
    const sx = g.x - cameraX;
    const cx = sx + g.width / 2;
    const topY = g.y;
    const midY = g.y + g.height * 0.42;
    const botY = g.y + g.height;

    const pulse = 8 + 4 * Math.sin(frameCount * 0.1);
    const glow = ctx.createRadialGradient(cx, midY, 2, cx, midY, 30 + pulse);
    glow.addColorStop(0, 'rgba(200,160,255,0.55)');
    glow.addColorStop(1, 'rgba(200,160,255,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(cx, midY, 30 + pulse, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = '#cfcfe6';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(cx, botY);
    ctx.lineTo(cx, midY);
    ctx.stroke();

    ctx.fillStyle = '#b083f0';
    ctx.beginPath();
    ctx.moveTo(cx, topY);
    ctx.lineTo(cx + g.width * 0.4, midY);
    ctx.lineTo(cx, midY + g.height * 0.18);
    ctx.lineTo(cx - g.width * 0.4, midY);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#5b3a8e';
    ctx.lineWidth = 1.5;
    ctx.stroke();
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const theme = LEVELS[currentLevelIndex].theme;
    drawBackground(theme);

    // رسم سکوها با تزیینات فانتزی
    platforms.forEach(p => {
        const isGround = p.color === '#4e9221';
        const grad = ctx.createLinearGradient(0, p.y, 0, p.y + p.height);
        if (isGround) {
            grad.addColorStop(0, '#6cbf3a');
            grad.addColorStop(1, '#3f7a1a');
        } else {
            grad.addColorStop(0, '#c97a3d');
            grad.addColorStop(1, '#8a4f22');
        }
        ctx.fillStyle = grad;
        ctx.fillRect(p.x - cameraX, p.y, p.width, p.height);
        if (isGround) drawGroundDecor(p); else drawPlatformDecor(p);
    });

    // رسم آجرهای قابل‌ضربه
    bricks.forEach(b => drawBrick(b));

    // رسم سکه‌های درخشان
    coins.forEach(c => {
        if (c.collected) return;
        const sx = c.x - cameraX;
        const g = ctx.createRadialGradient(sx - 2, c.y - 2, 1, sx, c.y, c.radius);
        g.addColorStop(0, '#fff7c2');
        g.addColorStop(1, '#FFD700');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(sx, c.y, c.radius, 0, Math.PI * 2);
        ctx.fill();

        const angle = frameCount * 0.08;
        ctx.strokeStyle = 'rgba(255,255,255,0.9)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(sx - Math.cos(angle) * (c.radius + 4), c.y - Math.sin(angle) * (c.radius + 4));
        ctx.lineTo(sx + Math.cos(angle) * (c.radius + 4), c.y + Math.sin(angle) * (c.radius + 4));
        ctx.stroke();
    });

    // رسم قارچ قدرت
    powerups.forEach(p => {
        if (p.collected) return;
        drawMushroomPowerup(p.x - cameraX, p.y, p.width, p.height);
    });

    // رسم دروازه کریستالی پایان مرحله
    if (goal) drawGoal(goal);

    // رسم خرچنگ‌ها
    enemies.forEach(enemy => {
        if (enemy.dead) return;
        drawCrab(enemy.x - cameraX, enemy.y, enemy.width, enemy.height);
    });

    // رسم بازیکن (دخترک)
    drawGirl(player.x - cameraX, player.y, player.width, player.height, player.facing, player.powered);

    // نمایش امتیاز و شماره مرحله
    ctx.fillStyle = '#FFF';
    ctx.font = '20px Arial';
    ctx.textAlign = 'left';
    ctx.fillText(`امتیاز: ${score}`, 20, 30);
    ctx.fillText(`مرحله ${currentLevelIndex + 1} از ${LEVELS.length}`, 20, 55);
    if (player.powered) {
        ctx.fillText('چکش همراهته! خرچنگ‌ها رو له کن 🔨', 20, 80);
    }

    // پیام بین مرحله‌ای
    if (gameState === 'transition') {
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#FFF';
        ctx.font = 'bold 32px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(transitionMessage, canvas.width / 2, canvas.height / 2);
        ctx.textAlign = 'left';
    }

    // پیام پایان بازی
    if (gameState === 'won') {
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#FFD700';
        ctx.font = 'bold 34px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('همه مراحل رو کامل کردی! 🏆', canvas.width / 2, canvas.height / 2 - 20);
        ctx.fillStyle = '#FFF';
        ctx.font = '22px Arial';
        ctx.fillText(`امتیاز نهایی: ${score}`, canvas.width / 2, canvas.height / 2 + 20);
        ctx.font = '18px Arial';
        ctx.fillText('برای شروع دوباره دکمه پرش یا Enter را بزن', canvas.width / 2, canvas.height / 2 + 55);
        ctx.textAlign = 'left';
    }
}

loadLevel(currentLevelIndex);
update();
</script>
